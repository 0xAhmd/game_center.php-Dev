<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Center Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/png" href="../assets/profile.png">
</head>

<body>

  <h3 class="store-title">
    <img src="../assets/logo.png" alt="Game Icon" width="100" class="me-2">
    Game Center </h1>

    <div class="search-bar mb-5">
      <input type="text" placeholder="Search for a game..." class="form-control shadow">
    </div>

    <div class="container">
      <div class="row g-4" id="game-cards-container">
        <!-- Game cards will be injected here by JavaScript -->
      </div>
    </div>


    <!-- Floating Add Game Button -->
    <button class="floating-btn" onclick="location.href='../HTML/add.html'">+ Add Game</button>

    <!-- Modal -->
    <div class="modal fade" id="editGameModal" tabindex="-1" aria-labelledby="editGameModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content p-4 bg-dark text-white rounded-4 shadow-lg">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="editGameModalLabel">Edit Game Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editGameForm" class="row g-3">

              <div class="col-md-6">
                <label for="editGameTitle" class="form-label">Game Title</label>
                <input type="text" id="editGameTitle" class="form-control form-control-lg"
                  placeholder="Enter game title">
              </div>

              <div class="col-md-6">
                <label for="editGameGenre" class="form-label">Genre</label>
                <input type="text" id="editGameGenre" class="form-control form-control-lg" placeholder="Action, RPG...">
              </div>

              <div class="col-md-6">
                <label for="editGamePrice" class="form-label">Price</label>
                <input type="number" id="editGamePrice" class="form-control form-control-lg" placeholder="0.00">
              </div>

              <div class="col-md-6">
                <label for="editGameImageUrl" class="form-label">Image URL</label>
                <input type="text" id="editGameImageUrl" class="form-control form-control-lg" placeholder="https://...">
              </div>

              <div class="col-12">
                <label for="editGameDescription" class="form-label">Description</label>
                <textarea id="editGameDescription" class="form-control form-control-lg" rows="4"
                  placeholder="Enter game description..."></textarea>
              </div>

            </form>
          </div>
          <div class="modal-footer border-0 d-flex justify-content-between">
            <div>
              <button type="button" class="btn btn-success px-4 me-2" onclick="saveEdit()">Save</button>
              <button type="button" class="btn btn-outline-light px-4" data-bs-dismiss="modal">Cancel</button>
            </div>
            <button type="button" class="btn btn-danger px-4" onclick="deleteGame()">Delete</button>
          </div>
        </div>
      </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/fetch_games.js"></script>
    <script src="../JS/delete_game.js"></script>
    <script src="../JS/scripts.js"></script>

</body>

</html>
