<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Add Game</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/profile.png">

</head>

<body>
  <div class="container mt-5">
    <h2 class="store-title" style="color: azure;">Add New Game</h2>
    <form method="POST" action="../scripts/add_game.php">
      <div class="mb-3">
        <label for="title" class="form-label">Game Title</label>
        <input type="text" id="title" name="title" class="form-control" placeholder="Game Title " required>
      </div>
      <div class="mb-3">
        <label for="genre" class="form-label">Genre</label>
        <input type="text" id="genre" name="genre" class="form-control" placeholder="Genre" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">About The Game</label>
        <textarea id="description" name="description" class="form-control" placeholder="Description"
          required></textarea>
      </div>
      <div class="mb-3">
        <label for="image_url" class="form-label">Image URL</label>
        <input type="text" id="image_url" name="image_url" class="form-control" placeholder="Image URL" required>
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" id="price" step="0.01" name="price" class="form-control" placeholder="Price" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary w-100">Add Game</button>
        <a href="index.html" class="btn btn-secondary w-100">Cancel</a>
      </div>
    </form>
  </div>
</body>

</html>
